<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlixOrbit - Premium Movie Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e50914;
      --primary-hover: #f40612;
      --bg: #141414;
      --surface: #1f1f1f;
      --text: #ffffff;
      --text-muted: #b3b3b3;
      --overlay: rgba(0, 0, 0, 0.85);
      --font: 'Outfit', sans-serif;
      --radius: 8px;
      --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #666;
    }

    /* Utilities */
    .hidden {
      display: none !important;
    }

    /* Skeletons */
    .skeleton {
      background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.2rem 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
      transition: background 0.4s ease;
    }

    header.scrolled {
      background: var(--bg);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-link {
      cursor: pointer;
      color: #ddd;
      font-weight: 500;
      transition: 0.2s;
    }

    .nav-link:hover {
      color: white;
    }

    .nav-link.active {
      color: white;
      border-bottom: 2px solid var(--primary);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      cursor: pointer;
      font-size: 1.4rem;
      transition: var(--transition);
      background: none;
      border: none;
      color: white;
    }

    .icon-btn:hover {
      color: var(--primary);
      transform: scale(1.1);
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 85vh;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 4%;
      background-size: cover;
      background-position: center;
      transition: 0.5s;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, var(--bg) 0%, rgba(20, 20, 20, 0.4) 50%, rgba(20, 20, 20, 0.8) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 600px;
      animation: fadeUp 1s ease-out;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      margin: 0 0 1rem;
      line-height: 1.1;
    }

    .hero-desc {
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 2rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn {
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(10px);
      margin-left: 1rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Search Overlay */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      padding: 20px;
      z-index: 2000;
      transform: translateY(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      height: 100vh;
      overflow-y: auto;
    }

    .search-overlay.active {
      transform: translateY(0);
    }

    .search-input-container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      margin-top: 60px;
    }

    .search-input {
      width: 100%;
      background: #333;
      border: none;
      padding: 1.2rem;
      font-size: 1.5rem;
      color: white;
      border-radius: 50px;
    }

    .close-search {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.5rem;
      color: #888;
    }

    /* Content Sections */
    .section {
      padding: 2rem 0;
      position: relative;
      z-index: 20;
      margin-top: -100px;
      /* Overlap hero slightly */
      min-height: 300px;
    }

    .section:nth-child(even),
    .section:not(:first-of-type) {
      margin-top: 0;
    }

    .section-header {
      padding: 0 4%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1rem;
      margin-left: 4%;
      border-left: 4px solid var(--primary);
      padding-left: 1rem;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 500;
      margin: 0;
      color: var(--text);
    }

    .movie-row {
      display: flex;
      gap: 16px;
      padding: 20px 4%;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 40px;
      /* Space for hover expansion */
    }

    .movie-row::-webkit-scrollbar {
      height: 6px;
    }

    /* Thinner scrollbar here */

    .card {
      flex: 0 0 200px;
      position: relative;
      border-radius: var(--radius);
      transition: var(--transition);
      cursor: pointer;
      aspect-ratio: 2/3;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.9), transparent);
      opacity: 0;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 15px;
    }

    .card:hover .card-overlay {
      opacity: 1;
    }

    .card:hover {
      transform: scale(1.1) translateY(-10px);
      z-index: 50;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      border: 2px solid var(--text);
    }

    .card-action {
      background: white;
      color: black;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      position: absolute;
      top: 10px;
      right: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.2s 0.1s;
    }

    .card:hover .card-action {
      opacity: 1;
      transform: translateY(0);
    }

    .card-action:hover {
      background: var(--primary);
      color: white;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 5000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-content {
      background: #181818;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 10;
      transition: 0.2s;
    }

    .close-modal:hover {
      background: white;
      color: black;
    }

    .modal-hero {
      height: 400px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .modal-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #181818 0%, transparent 100%);
    }

    .modal-body {
      padding: 0 40px 40px;
      transform: translateY(-80px);
      position: relative;
    }

    .modal-title {
      font-size: 2.5rem;
      margin: 0 0 1rem;
    }

    .meta-tags {
      display: flex;
      gap: 15px;
      align-items: center;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .tag {
      border: 1px solid #444;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-overview {
      line-height: 1.7;
      color: #ddd;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .providers-list {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .provider-icon {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .provider-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
    }

    .cast-grid,
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
      margin-top: 2rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: white;
      color: black;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 6000;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .cast-member {
      text-align: center;
      font-size: 0.85rem;
    }

    .cast-member img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.5rem;
      }

      .modal-body {
        padding: 20px;
        transform: translateY(-40px);
      }

      .hero {
        height: 70vh;
      }

      .nav-links {
        display: none;
      }

      /* Simplify mob nav */
    }
  </style>
</head>

<body>

  <div class="toast" id="toast">Added to Watchlist</div>

  <!-- Search Overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-input-container">
      <input type="text" class="search-input" id="searchInput" placeholder="Search movies, tv shows, people...">
      <div class="close-search" onclick="toggleSearch()">✕</div>
    </div>
    <div id="searchResults" class="movie-row" style="flex-wrap: wrap; justify-content: center; padding-top: 40px;">
    </div>
  </div>

  <!-- Header -->
  <header id="header">
    <div class="nav-left">
      <div class="logo">FlixOrbit</div>
      <div class="nav-links">
        <div class="nav-link active" onclick="scrollToSection('hero')">Home</div>
        <div class="nav-link" onclick="scrollToSection('trendingRow')">Trending</div>
        <div class="nav-link" onclick="scrollToSection('topRatedRow')">Top Rated</div>
        <div class="nav-link" onclick="scrollToSection('myListRow')">My List</div>
      </div>
    </div>
    <div class="nav-right">
      <button class="icon-btn" onclick="toggleSearch()">🔍</button>
      <img src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg"
        style="width:32px; height:32px; border-radius:4px; cursor:pointer;">
    </div>
  </header>

  <!-- Hero Section -->
  <div class="hero skeleton" id="hero">
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div id="heroButtons" class="hidden">
        <button class="btn btn-primary" id="heroBtn">▶ Play Trailer</button>
        <button class="btn btn-secondary" id="heroInfoBtn">ⓘ More Info</button>
      </div>
    </div>
  </div>

  <!-- Rows -->
  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Trending Now</h2>
    </div>
    <div class="movie-row" id="trendingRow"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">My Watchlist</h2>
    </div>
    <div class="movie-row" id="myListRow" style="min-height: 200px; align-items: center; color: #666;">
      <div style="padding:0 20px" id="emptyListMsg">Your watchlist is empty. Add movies to see them here!</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Top Rated</h2>
    </div>
    <div class="movie-row" id="topRatedRow"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Action Thrillers</h2>
    </div>
    <div class="movie-row" id="actionRow"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Comedy Hits</h2>
    </div>
    <div class="movie-row" id="comedyRow"></div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-content">
      <div class="close-modal" onclick="closeModal()">✕</div>
      <div class="modal-hero skeleton" id="modalHero"></div>
      <div class="modal-body">
        <h1 class="modal-title" id="modalTitle">Loading...</h1>
        <div class="meta-tags" id="modalMeta"></div>
        <p class="modal-overview" id="modalOverview"></p>

        <div class="modal-actions">
          <button class="btn btn-primary" id="modalPlayBtn">▶ Play Trailer</button>
          <button class="btn btn-secondary" id="modalListBtn">+ Add to List</button>
        </div>

        <h3>Watch On</h3>
        <div class="providers-list" id="modalProviders"></div>

        <h3>Top Cast</h3>
        <div class="cast-grid" id="modalCast"></div>

        <h3>You May Also Like</h3>
        <div class="rec-grid" id="modalRecs"></div>

        <div id="modalTrailer" style="margin-top: 30px;"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "07593288b7c70475b39caecfe7054e07";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_URL = "https://image.tmdb.org/t/p/original";

    // State
    let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];

    // Header Scroll
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    });

    function scrollToSection(id) {
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Watchlist Logic
    function toggleWatchlist(movie) {
      const idx = watchlist.findIndex(m => m.id === movie.id);
      if (idx > -1) {
        watchlist.splice(idx, 1);
        showToast("Removed from Watchlist");
      } else {
        watchlist.push(movie);
        showToast("Added to Watchlist");
      }
      localStorage.setItem('watchlist', JSON.stringify(watchlist));
      renderWatchlist();

      // Update modal button state if open
      const btn = document.getElementById('modalListBtn');
      if (btn) updateListBtnState(movie.id);
    }

    function updateListBtnState(id) {
      const btn = document.getElementById('modalListBtn');
      const inList = watchlist.some(m => m.id === id);
      btn.innerHTML = inList ? "✓ In My List" : "+ Add to List";
      btn.style.background = inList ? "white" : "rgba(255,255,255,0.2)";
      btn.style.color = inList ? "black" : "white";
    }

    function renderWatchlist() {
      const container = document.getElementById('myListRow');
      const emptyMsg = document.getElementById('emptyListMsg');

      // Clear existing cards but keep msg
      Array.from(container.children).forEach(c => {
        if (c.id !== 'emptyListMsg') c.remove();
      });

      if (watchlist.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        watchlist.forEach(m => container.appendChild(createCard(m)));
      }
    }

    // Fetch Utilities
    async function fetchData(endpoint) {
      try {
        const res = await fetch(`${BASE_URL}${endpoint}&api_key=${API_KEY}`);
        return await res.json();
      } catch (e) { console.error(e); return {}; }
    }

    function createCard(movie) {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <img src="${movie.poster_path ? IMG_URL + movie.poster_path : 'https://via.placeholder.com/200x300'}" alt="${movie.title}" loading="lazy">
        <div class="card-overlay">
           <span style="font-weight:600; font-size: 0.9rem">${movie.title}</span>
           <span style="font-size: 0.8rem; color:#ccc">${movie.release_date ? movie.release_date.split('-')[0] : ''}</span>
        </div>
        <button class="card-action" title="Add to Watchlist" onclick="event.stopPropagation(); toggleWatchlist({id:${movie.id}, title:'${movie.title.replace(/'/g, "\\'")}', poster_path:'${movie.poster_path}'})">+</button>
      `;
      div.onclick = () => openModal(movie.id);
      return div;
    }

    function createSkeletonCard() {
      const d = document.createElement('div');
      d.className = 'card skeleton';
      return d;
    }

    // Parallel Initialization
    async function init() {
      renderWatchlist();

      // Inject Skeleton Cards
      ['trendingRow', 'topRatedRow', 'actionRow', 'comedyRow'].forEach(id => {
        const c = document.getElementById(id);
        for (let i = 0; i < 8; i++) c.appendChild(createSkeletonCard());
      });

      // Fetch All Parallel
      const [trending, topRated, action, comedy] = await Promise.all([
        fetchData('/trending/movie/week?language=en-US'),
        fetchData('/movie/top_rated?language=en-US&page=1'),
        fetchData('/discover/movie?with_genres=28&language=en-US'),
        fetchData('/discover/movie?with_genres=35&language=en-US')
      ]);

      // 1. Setup Hero
      if (trending.results && trending.results[0]) {
        const heroMovie = trending.results[0];
        const heroEl = document.getElementById('hero');

        // Preload hero image for smoothness
        const img = new Image();
        img.src = BACKDROP_URL + heroMovie.backdrop_path;
        img.onload = () => {
          heroEl.style.backgroundImage = `url(${img.src})`;
          heroEl.classList.remove('skeleton');

          document.getElementById('heroTitle').textContent = heroMovie.title;
          document.getElementById('heroDesc').textContent = heroMovie.overview;
          document.getElementById('heroButtons').classList.remove('hidden');

          document.getElementById('heroInfoBtn').onclick = () => openModal(heroMovie.id);
          document.getElementById('heroBtn').onclick = () => openModal(heroMovie.id);
        }
      }

      // 2. Populate Rows (Clear skeletons first)
      function fillRow(id, movies) {
        const c = document.getElementById(id);
        c.innerHTML = '';
        movies.forEach(m => c.appendChild(createCard(m)));
      }

      if (trending.results) fillRow('trendingRow', trending.results);
      if (topRated.results) fillRow('topRatedRow', topRated.results);
      if (action.results) fillRow('actionRow', action.results);
      if (comedy.results) fillRow('comedyRow', comedy.results);
    }

    // Modal Logic
    let currentModalMovie = null;

    async function openModal(id) {
      const modal = document.getElementById('modal');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Reset Modal State
      document.getElementById('modalHero').classList.add('skeleton');
      document.getElementById('modalHero').style.backgroundImage = '';
      document.getElementById('modalTitle').textContent = 'Loading...';
      document.getElementById('modalMeta').innerHTML = '';
      document.getElementById('modalOverview').textContent = '';
      document.getElementById('modalProviders').innerHTML = '';
      document.getElementById('modalCast').innerHTML = '';
      document.getElementById('modalRecs').innerHTML = '';
      document.getElementById('modalTrailer').innerHTML = '';

      // Parallel Fetch Details
      const [movie, cast, videos, providers, recs] = await Promise.all([
        fetchData(`/movie/${id}?language=en-US`),
        fetchData(`/movie/${id}/credits?language=en-US`),
        fetchData(`/movie/${id}/videos?language=en-US`),
        fetchData(`/movie/${id}/watch/providers?`),
        fetchData(`/movie/${id}/recommendations?language=en-US&page=1`)
      ]);

      currentModalMovie = movie;

      // Update UI
      if (movie.backdrop_path) {
        document.getElementById('modalHero').style.backgroundImage = `url(${BACKDROP_URL + movie.backdrop_path})`;
        document.getElementById('modalHero').classList.remove('skeleton');
      }

      document.getElementById('modalTitle').textContent = movie.title;
      document.getElementById('modalOverview').textContent = movie.overview;
      document.getElementById('modalMeta').innerHTML = `
        <span class="tag">${movie.release_date.split('-')[0]}</span>
        <span class="tag">${movie.runtime} min</span>
        <span>${movie.vote_average.toFixed(1)}/10</span>
      `;

      // Update Watchlist Button
      const listBtn = document.getElementById('modalListBtn');
      listBtn.onclick = () => toggleWatchlist({ id: movie.id, title: movie.title, poster_path: movie.poster_path });
      updateListBtnState(movie.id);

      // Providers
      const flatrate = providers.results?.IN?.flatrate || providers.results?.US?.flatrate || [];
      document.getElementById('modalProviders').innerHTML = flatrate.length ? flatrate.map(p =>
        `<img class="provider-icon" src="${IMG_URL + p.logo_path}" title="${p.provider_name}">`
      ).join('') : '<span style="color:#666">No streaming info available.</span>';

      // Cast
      document.getElementById('modalCast').innerHTML = cast.cast.slice(0, 6).map(c => `
        <div class="cast-member">
          <img src="${c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/100'}" loading="lazy">
          <div>${c.name}</div>
        </div>
      `).join('');

      // Recommendations (Recs)
      if (recs.results) {
        document.getElementById('modalRecs').innerHTML = recs.results.slice(0, 6).map(m => `
            <div class="cast-member" style="cursor:pointer" onclick="openModal(${m.id})">
               <img src="${m.poster_path ? IMG_URL + m.poster_path : 'https://via.placeholder.com/100'}" style="border-radius:6px">
               <div style="font-size:0.8rem; margin-top:4px">${m.title}</div>
            </div>
         `).join('');
      }

      // Trailer
      const trailer = videos.results.find(v => v.type === "Trailer" && v.site === "YouTube");
      if (trailer) {
        document.getElementById('modalPlayBtn').onclick = () => {
          document.getElementById('modalTrailer').innerHTML = `<iframe width="100%" height="400" src="https://www.youtube.com/embed/${trailer.key}?autoplay=1" frameborder="0" allowfullscreen style="border-radius:12px"></iframe>`;
        };
      }
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => {
        document.getElementById('modalTrailer').innerHTML = ''; // Stop video playback
      }, 300);
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    // Search
    function toggleSearch() {
      const overlay = document.getElementById('searchOverlay');
      overlay.classList.toggle('active');
      if (overlay.classList.contains('active')) document.getElementById('searchInput').focus();
    }

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();

      if (query.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
      }

      searchTimeout = setTimeout(async () => {
        const res = await fetchData(`/search/movie?query=${encodeURIComponent(query)}&page=1`);
        const container = document.getElementById('searchResults');
        container.innerHTML = '';
        if (res.results) {
          res.results.forEach(m => container.appendChild(createCard(m)));
        }
      }, 500);
    });

    init();
  </script>
</body>

</html>
